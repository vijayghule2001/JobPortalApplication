<div class="step-form">
  <div class="form-group">
    <label class="form-label">Technical Skills</label>
    <div class="input-group">
      <input class="form-control" [(ngModel)]="skillInput" (keyup.enter)="addSkill()" />
      <button type="button" class="btn btn-primary" (click)="addSkill()">Add</button>
    </div>
    <div *ngIf="errorMessage" class="invalid-feedback d-block">{{ errorMessage }}</div>
  </div>

  <div class="badge-list" *ngIf="technicalSkills.length > 0">
    <span *ngFor="let skill of technicalSkills; let index = index" class="badge badge-primary">
      {{ skill }}
      <button type="button" (click)="removeSkill(index)" aria-label="Remove skill">x</button>
    </span>
  </div>

  <hr />

  <h3>Certifications</h3>
  <div class="row">
    <div class="col-12 col-md-4">
      <label class="form-label">Certification Name</label>
      <input class="form-control" [(ngModel)]="certificationForm.name" />
    </div>
    <div class="col-12 col-md-4">
      <label class="form-label">Issuer</label>
      <input class="form-control" [(ngModel)]="certificationForm.issuer" />
    </div>
    <div class="col-12 col-md-2">
      <label class="form-label">Year</label>
      <input class="form-control" [(ngModel)]="certificationForm.year" maxlength="4" />
    </div>
    <div class="col-12 col-md-2 cert-actions">
      <button type="button" class="btn btn-outline-primary" (click)="saveCertification()">
        {{ editingCertificationIndex === null ? 'Add' : 'Update' }}
      </button>
      <button *ngIf="editingCertificationIndex !== null" type="button" class="btn btn-link" (click)="cancelEdit()">
        Cancel
      </button>
    </div>
  </div>

  <div class="list-table" *ngIf="certifications.length > 0">
    <div *ngFor="let certification of certifications; let index = index" class="list-row">
      <div>
        <strong>{{ certification.name }}</strong>
        <span>{{ certification.issuer }} {{ certification.year }}</span>
      </div>
      <div>
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="editCertification(index)">Edit</button>
        <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeCertification(index)">Remove</button>
      </div>
    </div>
  </div>

  <div class="wizard-actions">
    <button type="button" class="btn btn-outline-secondary" (click)="goPrevious()">Previous</button>
    <button type="button" class="btn btn-primary" [disabled]="technicalSkills.length === 0" (click)="goNext()">Next</button>
  </div>
</div>
